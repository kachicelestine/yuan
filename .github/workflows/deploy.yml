name: Deploy

# Runs deploy/scripts/deploy.sh on the production server over SSH. The server builds the
# image itself (native arm64, no registry needed). Set these repository secrets first:
#   DEPLOY_HOST (IP or name), DEPLOY_USER (ubuntu), DEPLOY_SSH_KEY (private key),
#   DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan <host>`).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to deploy
        default: origin/main
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          REF: ${{ github.event.inputs.ref || 'origin/main' }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$TARGET" "/opt/lychee/deploy/scripts/deploy.sh '$REF'"
